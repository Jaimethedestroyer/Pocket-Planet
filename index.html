<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070d" />
    <meta name="description" content="A persistent civilization simulation on a living planet." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Pocket Planet</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%234a8fd4'/%3E%3Cpath d='M7 13c4 2 7-1 11 1s6 0 7-1' stroke='%2354b06a' stroke-width='4' fill='none'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="viewport"></canvas>

    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">Pocket Planet</div>
        <div class="boot-bar"><span id="boot-fill"></span></div>
        <div class="boot-status" id="boot-status">forming crust</div>
      </div>
    </div>

    <div id="hud" hidden>
      <div class="hud-row"><span>fps</span><b id="hud-fps">—</b></div>
      <div class="hud-row"><span>altitude</span><b id="hud-alt">—</b></div>
      <div class="hud-row"><span>patches</span><b id="hud-patches">—</b></div>
      <div class="hud-row"><span>triangles</span><b id="hud-tris">—</b></div>
      <div class="hud-row"><span>lod</span><b id="hud-lod">—</b></div>
      <div class="hud-row"><span>pending</span><b id="hud-pending">—</b></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
